<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>版畫與套印藝術 (Printmaking & Overprint)</title>
</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/106403972陳柏諺.jpg" alt="仙人掌開花">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">OVER PRINT 疊印構圖作品</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                結合仙人掌、螳螂、向日葵和章魚，做成仙人掌有開花效果的視覺感官。運用紫、藍、綠、紅等對比色彩進行疊印，呈現出豐富的紋理層次與視覺張力。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>1890 × 1417 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
