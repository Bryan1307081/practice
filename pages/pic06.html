<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>向量圖樣與視覺設計</title>

</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/圖樣色票-草圖.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">向量插畫 / 元素設計</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                包含小雞、瓢蟲、花朵、水母、蝸牛及多種幾何點線面形狀的可愛手繪插畫元素，作為圖樣設計（Pattern Design）的基本單元。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Illustrator</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>1366 × 768 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
