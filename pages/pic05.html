<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>影像處理 / 色調</title>
</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/A Man Statue.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">古典雕像 - 莫蘭迪灰藍色調</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                對男性古典雕像進行低對比度與灰藍冷色調處理，營造出如博物館展廳般莊嚴、肅穆且具備歷史沉澱感的視覺氣氛。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>2821 × 4231 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
