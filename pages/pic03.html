<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>影像雙重曝光 / 融合</title>

</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/Sunflower&Betta fish.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">向日葵與紅鬥魚 (Sunflower & Betta Fish)</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                將鮮紅的鬥魚與盛開的向日葵花海進行雙重曝光合成，結合水滴玻璃質感，呈現動植物交織的生命力與絢麗色彩。展開附與生命力鬥魚尾部與向日葵交織的疊影!
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>3024 × 4032 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
