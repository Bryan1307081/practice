<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>雙重曝光 / 人像藝術</title>

</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/Naked man with sea.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">海洋與沉思者 (Naked Man with Sea)</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                運用古典雕塑般的人形輪廓與湛藍海岸風景進行雙重曝光，融合雜訊粒子質感，表達人與海洋的自然融合沒有任何束縛的自由感。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>3990 × 5985 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
