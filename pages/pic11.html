<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>普普藝術 / Pop Art</title>
</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/慈祥修女.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">修女與惡的美感</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                給予善與惡的結合! 交織與衝突!
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>1920 × 1080 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
