<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>夏日宣傳海報與動態影像</title>

</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="card-video-wrapper">
            <video autoplay loop muted playsinline controls>
                        <source src="../images/summer_video.mp4" type="video/mp4">
                        <!-- 您的瀏覽器不支援 HTML5 影片播放。 -->
                    </video>
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">海報設計 / 動態媒體</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                以「釋放夏日能量」為主題，整合浮潛（Go Snorkeling）、獨木舟（Go Canoeing）、衝浪（Go Surfing）等多張水上活動照片，搭配手繪風插畫與豐富色彩的拼貼風格視覺。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop / Illustrator</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>1080 × 1350 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
