<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pic.css">
    <title>超現實與數位合成</title>
</head>
<body>

    <main class="artwork-container">
        
        <!-- 1. 圖片區塊（請替換 src 網址或檔名） -->
        <div class="artwork-media">
            <img src="../images/鯨魚-筆刷-完整.jpg" alt="作品名稱">
        </div>

        <!-- 2. 作品介紹 -->
        <div class="artwork-content">
            
            <div class="artwork-header">
                <h1 class="artwork-title">飛躍雲端的鯨魚</h1>
                <span class="artwork-tag">創作類別</span>
            </div>

            <p class="artwork-description">
                結合金屬質感鯨魚、粉紅巨月與綠色雲海的超現實數位合成作品。運用大量水彩與噴灑筆刷，營造夢幻且空靈的視覺意境。
            </p>

            <!-- 3. 詳細資訊 -->
            <div class="artwork-details">
                <div class="detail-item">
                    <label>創作年份</label>
                    <span>2026</span>
                </div>
                <div class="detail-item">
                    <label>使用工具 / 軟體</label>
                    <span>Photoshop</span>
                </div>
                <div class="detail-item">
                    <label>尺寸 / 規格</label>
                    <span>1200 × 800 px</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
